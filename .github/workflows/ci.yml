name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate data
        run: python scripts/validate.py
      - name: Build
        run: python build.py
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Committed output matches build
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "Generated files are out of date or missing: run python3 build.py and commit the result."; git diff --stat; exit 1; }
